services:
  - type: web
    name: lifesync-backend
    env: python
    region: ohio
    plan: free
    buildCommand: "pip install ./lifesync-mcp-toolkit && pip install -r server/requirements.txt"
    startCommand: "cd server && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.0
